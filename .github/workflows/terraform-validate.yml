name: Terraform Validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init (dev)
        run: terraform -chdir=environments/dev init -backend=false

      - name: Terraform Validate (dev)
        run: terraform -chdir=environments/dev validate

      - name: Terraform Init (prod)
        run: terraform -chdir=environments/prod init -backend=false

      - name: Terraform Validate (prod)
        run: terraform -chdir=environments/prod validate
